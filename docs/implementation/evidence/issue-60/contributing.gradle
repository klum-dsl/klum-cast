// Opt-in RC qualification probe. Never apply to publication or ordinary builds.
def inputs = gradle.startParameter.projectProperties
def castVersion = inputs.castCandidateVersion
// Gradle also evaluates init scripts for buildSrc, without the root project properties.
if (!castVersion) return
if (!inputs.castCandidateRepository || !inputs.castProbeRoot || !inputs.castForeignJar)
    throw new GradleException('Supply castCandidateVersion, castCandidateRepository, castProbeRoot and castForeignJar')
def castModules = ['klum-cast-annotations', 'klum-cast-spi', 'klum-cast-compile']
gradle.beforeProject { p ->
    p.repositories.exclusiveContent {
        forRepository { p.repositories.maven { url = uri(inputs.castCandidateRepository) } }
        filter { includeGroup('com.blackbuild.klum.cast') }
    }
    p.repositories.mavenCentral()
    p.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.blackbuild.klum.cast' && details.requested.name in castModules)
                details.useVersion(castVersion)
        }
    }
}
gradle.projectsEvaluated {
    def compiler = gradle.rootProject.findProject(':klum-ast')
    if (compiler == null) return
    def probe = new File(inputs.castProbeRoot)
    compiler.sourceSets.main.java.srcDir(new File(probe, 'java'))
    compiler.sourceSets.main.resources.srcDir(new File(probe, 'resources'))
    compiler.dependencies.add('api', compiler.files(inputs.castForeignJar))
    ['testFixtures', 'groovy4Tests', 'groovy5Tests'].each { lane ->
        if (lane == 'testFixtures') compiler.sourceSets[lane].groovy.srcDir(new File(probe, 'groovy'))
        compiler.tasks.register("verifyRcFix${lane.capitalize()}", JavaExec) {
            dependsOn compiler.tasks.named("${lane}Classes")
            classpath = compiler.sourceSets[lane].runtimeClasspath
            if (lane == 'testFixtures') classpath += compiler.configurations.testFixturesCompileClasspath
            mainClass = 'ap1candidate.Candidate'
        }
    }
}
